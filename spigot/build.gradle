import java.util.stream.Collectors


plugins {
    id "io.github.rancraftplayz.remapper" version "1.0.2"
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.8'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

repositories {
    maven {
        name "Spigot"
        url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
}

//build {
//    //inputFile = shadowJar.archiveFile
//    dependsOn shadowJar
//}

dependencies {
    paperweight.paperDevBundle(rootProject.spigot_api_version);
    implementation(project(":common"))

    // 1.21.4 to 1.21 etc.
    String majorMinecraftVersion = String.join(".", rootProject.minecraft_version.split("\\.").stream().limit(2).collect(Collectors.toList()))
    testImplementation "org.mockbukkit.mockbukkit:mockbukkit-v${majorMinecraftVersion}:4.25.0"
    implementation('com.github.javafaker:javafaker:1.0.2') {
        exclude group: 'org.yaml', module: 'snakeyaml'
    }
    // small fix for faker
    implementation group: 'org.yaml', name: 'snakeyaml', version: '2.2'

    // import the runtime
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

spigot {
    version = rootProject.minecraft_version
}

task deleteResources(type: Delete) {
    delete file("build/resources/main")
}

processResources {
    dependsOn(copyCoreResources)
    dependsOn(copyCommonLoaderResources)
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    archiveBaseName.set("${rootProject.mod_id}-spigot-${rootProject.mod_version}-${rootProject.minecraft_version}")
    archiveClassifier.set('')
    archiveVersion.set('')
}

shadowJar {
    dependsOn remapJar
}

paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.Companion.REOBF_PRODUCTION